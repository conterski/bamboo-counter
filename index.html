<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Bamboo Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>

  <div id="empty">
    <div class="logo">🎋</div>
    <h1>Bamboo Counter</h1>
    <p>Photograph the cut ends of the load, square on. Auto-detect finds most of
       them; tap to fix the rest.</p>
    <label class="btn primary big" for="file">Choose photo</label>
    <input type="file" id="file" accept="image/*" class="vh">
    <a id="selftest" href="test.html">Not working? Run the self test</a>
  </div>

  <div id="hud" hidden>
    <div id="count"><b id="n">0</b><span id="target"></span></div>
    <div id="hint"></div>
  </div>

  <div id="busy" hidden>
    <div class="spin"></div>
    <span id="busytext">Working…</span>
    <span id="busystage"></span>
    <button class="btn" id="busycancel">Cancel</button>
  </div>
</div>

<div id="errbar" hidden>
  <div id="errtext"></div>
  <button class="btn" id="errclose">Dismiss</button>
</div>

<div id="bar" hidden>
  <button class="btn" id="detect" title="Auto-detect">✨<small>Detect</small></button>
  <button class="btn" id="undo" title="Undo">↩<small>Undo</small></button>
  <button class="btn" id="fit" title="Fit to screen">⤢<small>Fit</small></button>
  <button class="btn" id="expect" title="Expected quantity">#<small>Expected</small></button>
  <button class="btn" id="save" title="Save image">⬇<small>Save</small></button>
  <label class="btn" title="New photo" for="file2">🖼<small>New</small></label>
  <input type="file" id="file2" accept="image/*" class="vh">
</div>

<div id="sheet" hidden>
  <div class="sheetbody">
    <h2 id="sheettitle">Expected quantity</h2>
    <p id="sheettext">If the docket says a number, put it here and the counter
       will show the difference as you work.</p>
    <input type="number" id="expectval" inputmode="numeric" placeholder="e.g. 100">
    <div class="row">
      <button class="btn wide" id="sheetclear">Clear</button>
      <button class="btn wide primary" id="sheetok">Done</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
